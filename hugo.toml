baseURL = "/"
title = "Minsu Jang"
theme = "PaperMod"
paginate = 10
defaultContentLanguage = "en"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Minsu Jang"
  defaultTheme = "auto"
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowFullTextinRSS = true
  disableSpecial1stPost = true
  disableScrollToTop = false
  hideSummary = false
  showtoc = true

  [params.cover]
    hidden = true
    hiddenInList = true

  [params.assets]
    favicon = ""
    disableFingerprinting = true

[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    languageCode = "en-us"
    [languages.en.params]
      description = "Principal Researcher at ETRI - Social Human-Robot Interaction, Foundation Models for Robotics"
      [languages.en.params.profileMode]
        enabled = true
        title = "Minsu Jang"
        subtitle = "Principal Researcher, ETRI"
        imageUrl = "minsujang_profile.png"
        imageWidth = 143
        imageHeight = 160
        imageTitle = "Minsu Jang"
        [[languages.en.params.profileMode.buttons]]
          name = "CV"
          url = "cv"
        [[languages.en.params.profileMode.buttons]]
          name = "Blog"
          url = "posts"
      [languages.en.params.homeInfoParams]
        Title = "Minsu Jang"
        Content = "Principal Researcher at ETRI, working on Social Human-Robot Interaction and Foundation Models for Robotics."
    [[languages.en.params.socialIcons]]
      name = "email"
      url = "mailto:minsu@etri.re.kr"
    [[languages.en.params.socialIcons]]
      name = "googlescholar"
      url = "https://scholar.google.com/citations?user=ggkuHCcAAAAJ"
    [[languages.en.params.socialIcons]]
      name = "other"
      title = "DBPia"
      url = "https://www.dbpia.co.kr/author/authorDetail?ancId=5487192"
    [[languages.en.params.socialIcons]]
      name = "github"
      url = "https://github.com/zebehn"
    [[languages.en.menu.main]]
      identifier = "cv"
      name = "CV"
      url = "/cv/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "posts"
      name = "Blog"
      url = "/posts/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "hifi"
      name = "HI-FI"
      url = "/hifi-audio/"
      weight = 30

  [languages.ko]
    languageName = "한국어"
    weight = 2
    languageCode = "ko"
    [languages.ko.params]
      description = "ETRI 책임연구원 - 사회적 인간-로봇 상호작용, 로봇을 위한 파운데이션 모델"
      [languages.ko.params.profileMode]
        enabled = true
        title = "장민수"
        subtitle = "ETRI 책임연구원"
        imageUrl = "minsujang_profile.png"
        imageWidth = 143
        imageHeight = 160
        imageTitle = "장민수"
        [[languages.ko.params.profileMode.buttons]]
          name = "이력서"
          url = "cv"
        [[languages.ko.params.profileMode.buttons]]
          name = "블로그"
          url = "posts"
      [languages.ko.params.homeInfoParams]
        Title = "장민수"
        Content = "ETRI 책임연구원. 사회적 인간-로봇 상호작용 및 로봇을 위한 파운데이션 모델 연구."
    [[languages.ko.params.socialIcons]]
      name = "email"
      url = "mailto:minsu@etri.re.kr"
    [[languages.ko.params.socialIcons]]
      name = "googlescholar"
      url = "https://scholar.google.com/citations?user=ggkuHCcAAAAJ"
    [[languages.ko.params.socialIcons]]
      name = "other"
      title = "DBPia"
      url = "https://www.dbpia.co.kr/author/authorDetail?ancId=5487192"
    [[languages.ko.params.socialIcons]]
      name = "github"
      url = "https://github.com/zebehn"
    [[languages.ko.menu.main]]
      identifier = "cv"
      name = "이력서"
      url = "/ko/cv/"
      weight = 10
    [[languages.ko.menu.main]]
      identifier = "posts"
      name = "블로그"
      url = "/ko/posts/"
      weight = 20
    [[languages.ko.menu.main]]
      identifier = "hifi"
      name = "HI-FI"
      url = "/ko/hifi-audio/"
      weight = 30

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
